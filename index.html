<!DOCTYPE html>
<html lang="es-AR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Itinerario práctico de 30 días por Vietnam, Taiwán y Japón: reservas, clima orientativo, recomendaciones y checklist de viaje.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#101820">
<title>Vietnam · Taiwán · Japón 2026 — Bitácora del viaje</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#101820;
    --ink-2:#182330;
    --ink-line:rgba(247,242,231,0.14);
    --paper:#F7F2E7;
    --paper-2:#EFE7D4;
    --paper-line:rgba(28,37,33,0.11);
    --text:#20281f;
    --text-muted:#616f5f;
    --on-ink:#F7F2E7;
    --on-ink-muted:rgba(247,242,231,0.62);

    --jade:#356b52;
    --jade-ink:#254a3a;
    --jade-soft:#DEE9E0;

    --vermilion:#a83a2c;
    --vermilion-ink:#7c2b21;
    --vermilion-soft:#F2DFD9;

    --gold:#a2721f;
    --gold-fill:#d9a53c;
    --gold-soft:#F3E6C7;

    --radius-lg:18px;
    --radius-md:12px;
    --radius-sm:8px;
    --shadow-card: 0 1px 2px rgba(20,24,18,0.06), 0 6px 16px -8px rgba(20,24,18,0.18);
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  html{ scroll-behavior:auto; }
  body{
    background:var(--paper);
    color:var(--text);
    font-family:'Inter',system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;
    line-height:1.45;
    padding-bottom: calc(86px + env(safe-area-inset-bottom));
  }
  h1,h2,h3,.serif{ font-family:'Fraunces', Georgia, serif; }
  .app{ max-width:640px; margin:0 auto; position:relative; }

  /* ---------- COVER ---------- */
  .cover{ position:relative; width:100%; height:clamp(122px,24vw,168px); overflow:hidden; background:var(--ink); }
  .cover img{ width:100%; height:100%; object-fit:cover; object-position:center 39%; display:block; transform:scale(1.015); }
  .cover__fade{ position:absolute; inset:0; background:linear-gradient(to bottom, rgba(16,24,32,0.03) 34%, var(--ink) 100%); }

  /* ---------- HEADER ---------- */
  header.top{
    background:var(--ink);
    color:var(--on-ink);
    padding: 22px 20px 18px;
    position:sticky; top:0; z-index:20;
    border-bottom:1px solid var(--ink-line);
    transition:box-shadow .14s ease;
  }
  .top__flags{ display:flex; align-items:center; gap:5px; margin-bottom:8px; }
  .flag-icon{ display:block; flex:none; border-radius:2px; }
  .flag-arrow{ font-size:11px; color:var(--on-ink-muted); margin:0 1px; }
  .top__title{
    font-size:27px; font-weight:600; margin:0 0 2px; letter-spacing:-0.01em;
    display:flex; align-items:baseline; gap:8px; flex-wrap:wrap;
  }
  .top__title em{ font-style:italic; font-weight:400; color:var(--gold-fill); }
  .top__dates{ font-size:14px; color:var(--on-ink-muted); margin-bottom:16px; }

  .progress{ height:8px; border-radius:5px; overflow:hidden; display:flex; background:rgba(247,242,231,0.1); position:relative; }
  .progress__seg{ height:100%; }
  .progress__marker{
    position:absolute; top:-4px; width:2px; height:16px; background:var(--on-ink);
    border-radius:1px; box-shadow:0 0 0 3px rgba(16,24,32,1), 0 0 0 4px rgba(247,242,231,0.9);
  }
  .top__status{ margin-top:10px; font-size:13.5px; color:var(--on-ink-muted); }
  .top__status strong{ color:var(--on-ink); font-weight:600; }
  header.top.is-compact{ padding:10px 16px 9px; box-shadow:0 8px 24px rgba(8,12,16,.16); }
  header.top.is-compact .top__flags,
  header.top.is-compact .top__dates{ display:none; }
  header.top.is-compact .top__title{ font-size:18px; margin:0 0 7px; }
  header.top.is-compact .progress{ height:5px; }
  header.top.is-compact .top__status{ margin-top:5px; font-size:11.5px; }

  /* ---------- TABS ---------- */
  nav.tabs{
    position:fixed; left:0; right:0; bottom:0; z-index:30;
    background:rgba(16,24,32,0.97);
    border-top:1px solid var(--ink-line);
    padding: 8px max(12px, env(safe-area-inset-left)) calc(8px + env(safe-area-inset-bottom));
  }
  nav.tabs .row{ max-width:640px; margin:0 auto; display:flex; }
  nav.tabs button{
    flex:1; background:none; border:none; color:var(--on-ink-muted);
    display:flex; flex-direction:column; align-items:center; gap:4px;
    font-family:inherit; font-size:11.5px; padding:6px 4px; cursor:pointer;
    border-radius:10px; min-width:0; transition:color .18s ease, background-color .18s ease, transform .18s ease;
  }
  nav.tabs button svg{ width:20px; height:20px; }
  nav.tabs button.active{ color:var(--gold-fill); background:rgba(247,242,231,.07); }
  nav.tabs button.active svg{ stroke:var(--gold-fill); }
  button:focus-visible, a:focus-visible, summary:focus-visible, input:focus-visible{
    outline:3px solid var(--gold-fill); outline-offset:3px;
  }

  /* ---------- PANELS ---------- */
  main{ padding: 18px 16px 28px; }
  .panel{ display:none; }
  .panel.active{ display:block; animation:fadein .25s ease; }
  @keyframes fadein{ from{opacity:0; transform:translateY(4px);} to{opacity:1; transform:none;} }

  .leg-banner{
    display:flex; align-items:center; gap:10px;
    margin: 22px 0 12px; padding-bottom:8px;
    border-bottom:2px solid var(--paper-line);
  }
  .leg-banner:first-child{ margin-top:2px; }
  .leg-banner__flag{ font-size:20px; }
  .leg-banner__label{ font-size:15px; font-weight:600; }
  .leg-banner__meta{ font-size:12.5px; color:var(--text-muted); margin-left:auto; }
  .leg-banner__sub{ font-size:12px; color:var(--text-muted); font-style:italic; margin:-6px 0 12px; }

  /* today pin + upcoming preview */
  .today-pin{
    background:#fff; border-radius:var(--radius-lg); box-shadow:0 2px 4px rgba(20,24,18,0.08), 0 10px 24px -10px rgba(20,24,18,0.28);
    padding:16px 16px 14px; margin-bottom:14px; border:1.5px solid var(--gold-fill);
  }
  .today-pin[data-leg="VN"]{ border-color:var(--jade); }
  .today-pin[data-leg="JP"]{ border-color:var(--vermilion); }
  .today-pin__tag{ font-size:12px; font-weight:700; color:var(--gold); letter-spacing:.02em; margin-bottom:2px; }
  .today-pin[data-leg="VN"] .today-pin__tag{ color:var(--jade-ink); }
  .today-pin[data-leg="JP"] .today-pin__tag{ color:var(--vermilion-ink); }

  .upcoming-label{ font-size:12.5px; font-weight:700; color:var(--text-muted); margin:14px 2px 8px; }
  .upcoming-list{ display:flex; flex-direction:column; gap:8px; margin-bottom:6px; }
  .upcoming-card{
    display:flex; align-items:center; gap:10px; width:100%; text-align:left; background:var(--paper-2);
    border:none; border-radius:var(--radius-md); padding:10px 12px; font-family:inherit; cursor:pointer;
  }
  .upcoming-card__badge{
    flex:none; width:26px; height:26px; border-radius:50%; background:#fff; display:flex; align-items:center;
    justify-content:center; font-size:11.5px; font-weight:700; color:var(--text-muted);
  }
  .upcoming-card__text{ display:flex; flex-direction:column; gap:1px; min-width:0; }
  .upcoming-card__date{ font-size:12px; font-weight:700; }
  .upcoming-card__activity{ font-size:12px; color:var(--text-muted); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }

  .section-divider{
    font-size:11.5px; font-weight:700; color:var(--text-muted); text-align:center; margin:22px 0 14px;
    position:relative;
  }
  .section-divider::before, .section-divider::after{
    content:''; position:absolute; top:50%; width:calc(50% - 70px); height:1px; background:var(--paper-line);
  }
  .section-divider::before{ left:0; }
  .section-divider::after{ right:0; }


  /* day card */
  .day-card{
    background:#fff; border-radius:var(--radius-lg); margin-bottom:10px;
    box-shadow:var(--shadow-card); overflow:hidden; border-left:4px solid var(--jade);
    scroll-margin-top:112px;
    transition:transform .2s ease, box-shadow .2s ease;
  }
  .day-card[data-leg="TW"]{ border-left-color:var(--gold-fill); }
  .day-card[data-leg="JP"]{ border-left-color:var(--vermilion); }
  .day-card.is-today{ outline:2px solid var(--gold-fill); outline-offset:-2px; }

  .day-card__head{ display:flex; align-items:center; padding:14px 16px 10px; gap:12px; list-style:none; cursor:pointer; }
  .day-card__head::-webkit-details-marker{ display:none; }
  .day-card__head::marker{ content:''; }
  .day-card__chev{ flex:none; color:var(--text-muted); transition:transform .2s ease; }
  .day-card[open] .day-card__chev{ transform:rotate(90deg); }
  .day-card__badge{
    flex:none; width:38px; height:38px; border-radius:50%; display:flex; align-items:center; justify-content:center;
    font-family:'Fraunces',serif; font-weight:600; font-size:13px; color:var(--jade-ink);
    border:1.5px dashed var(--jade); transform:rotate(-7deg);
  }
  .day-card[data-leg="TW"] .day-card__badge{ border-color:var(--gold-fill); color:var(--gold); }
  .day-card[data-leg="JP"] .day-card__badge{ border-color:var(--vermilion); color:var(--vermilion-ink); }
  .day-card__headtext{ flex:1; min-width:0; }
  .day-card__daynum{ font-size:11px; color:var(--text-muted); letter-spacing:.04em; }
  .day-card__date{ font-size:18px; font-weight:600; margin-top:1px; }
  .day-card__today-chip{
    display:inline-block; font-size:10.5px; font-weight:700; color:#fff; background:var(--gold-fill);
    padding:2px 7px; border-radius:20px; margin-left:8px; vertical-align:middle; letter-spacing:.02em;
  }
  .status-chip{ font-size:12px; white-space:nowrap; flex:none; }
  .status-chip.pending{ color:var(--vermilion-ink); font-weight:600; }
  .status-chip.confirmed{ color:var(--jade-ink); }

  .day-card__body{ padding:0 16px 16px; }
  .day-card__place{ font-size:15.5px; font-weight:700; margin:0 0 8px; }
  .day-card__activity{ font-size:15px; line-height:1.56; color:var(--text); margin:0 0 10px; }
  .day-card__stay{ font-size:13px; color:var(--text-muted); margin:0; display:flex; gap:6px; }
  .day-card__stay .ic{ flex:none; margin-top:1px; }

  .chip-row{ display:flex; flex-wrap:wrap; gap:6px; margin-bottom:10px; }
  .place-chip, .maps-chip{
    display:inline-flex; align-items:center; gap:4px; font-size:11.5px; font-weight:600;
    color:var(--jade-ink); background:var(--jade-soft); border-radius:20px; padding:4px 10px 4px 8px;
    text-decoration:none; white-space:nowrap;
  }
  .day-card[data-leg="TW"] .place-chip{ color:var(--gold); background:var(--gold-soft); }
  .day-card[data-leg="JP"] .place-chip{ color:var(--vermilion-ink); background:var(--vermilion-soft); }
  .maps-chip{ color:var(--jade-ink); background:none; padding:2px 0; text-decoration:underline; text-decoration-color:rgba(53,107,82,0.35); text-underline-offset:2px; }
  .pdf-chip{ color:var(--text); background:var(--paper-2); padding:4px 10px 4px 8px; text-decoration:none; }
  .pin-ic{ flex:none; }

  details.schedule{ margin-top:12px; }
  details.schedule summary{
    list-style:none; cursor:pointer; font-size:13px; font-weight:600; color:var(--jade-ink);
    display:flex; align-items:center; gap:6px; padding:8px 0; border-top:1px solid var(--paper-line);
  }
  .day-card[data-leg="TW"] details.schedule summary{ color:var(--gold); }
  .day-card[data-leg="JP"] details.schedule summary{ color:var(--vermilion-ink); }
  details.schedule summary::-webkit-details-marker{ display:none; }
  details.schedule summary .chev{ transition:transform .2s ease; }
  details.schedule[open] summary .chev{ transform:rotate(90deg); }
  .day-note{ font-size:12.5px; color:var(--text-muted); font-style:italic; margin:2px 0 10px; }
  ul.hours{ list-style:none; margin:0; padding:0; }
  ul.hours li{ display:grid; grid-template-columns:74px 1fr; gap:10px; padding:7px 0; border-top:1px dashed var(--paper-line); }
  ul.hours li:first-child{ border-top:none; }
  ul.hours .hora{ font-size:12px; font-weight:600; color:var(--jade-ink); }
  .day-card[data-leg="TW"] ul.hours .hora{ color:var(--gold); }
  .day-card[data-leg="JP"] ul.hours .hora{ color:var(--vermilion-ink); }
  ul.hours .act{ font-size:13px; }
  ul.hours .nota{ display:block; font-size:12px; color:var(--text-muted); margin-top:2px; }

  /* ---------- CLIMA Y RECOMENDACIONES ---------- */
  .day-weather{
    display:grid; grid-template-columns:auto 1fr; align-items:center; gap:11px;
    margin:2px 0 12px; padding:11px 12px; border-radius:var(--radius-md);
    background:linear-gradient(135deg, rgba(53,107,82,.09), rgba(53,107,82,.035));
    border:1px solid rgba(53,107,82,.15);
  }
  .day-card[data-leg="TW"] .day-weather{ background:linear-gradient(135deg, rgba(217,165,60,.14), rgba(217,165,60,.04)); border-color:rgba(162,114,31,.18); }
  .day-card[data-leg="JP"] .day-weather{ background:linear-gradient(135deg, rgba(168,58,44,.09), rgba(168,58,44,.025)); border-color:rgba(168,58,44,.14); }
  .weather-temp{ font-family:'Fraunces',serif; font-size:21px; font-weight:600; letter-spacing:-.02em; white-space:nowrap; }
  .weather-kicker{ font-size:10.5px; font-weight:700; text-transform:uppercase; letter-spacing:.055em; color:var(--text-muted); }
  .weather-copy{ font-size:12.5px; color:var(--text-muted); line-height:1.42; margin-top:1px; }
  .weather-copy strong{ color:var(--text); font-weight:600; }
  details.day-guide{ margin-top:12px; border-top:1px solid var(--paper-line); }
  details.day-guide summary{
    list-style:none; cursor:pointer; display:flex; align-items:center; gap:7px;
    padding:11px 0 7px; color:var(--text); font-size:13px; font-weight:700;
  }
  details.day-guide summary::-webkit-details-marker{ display:none; }
  details.day-guide summary .chev{ transition:transform .2s ease; color:var(--text-muted); }
  details.day-guide[open] summary .chev{ transform:rotate(90deg); }
  .reco-list{ display:grid; gap:8px; padding:2px 0 1px; }
  .reco-card{ background:var(--paper); border:1px solid var(--paper-line); border-radius:var(--radius-md); padding:11px 12px; }
  .reco-top{ display:flex; align-items:flex-start; justify-content:space-between; gap:10px; }
  .reco-type{ font-size:10.5px; font-weight:700; color:var(--vermilion-ink); text-transform:uppercase; letter-spacing:.05em; }
  .reco-title{ font-size:13.5px; font-weight:700; margin-top:1px; }
  .reco-copy{ font-size:12.5px; color:var(--text-muted); line-height:1.48; margin:5px 0 8px; }
  .reco-actions{ display:flex; flex-wrap:wrap; gap:8px; }
  .action-link{ display:inline-flex; align-items:center; gap:5px; font-size:12px; font-weight:700; color:var(--jade-ink); text-decoration:none; }
  .action-link::after{ content:'↗'; font-size:11px; }
  .guide-note{ font-size:11.5px; color:var(--text-muted); margin:9px 0 0; }

  /* ---------- RESERVAS ---------- */
  .ticket{
    background:var(--ink); color:var(--on-ink); border-radius:var(--radius-lg);
    padding:18px 18px 16px; margin-bottom:20px; position:relative;
  }
  .ticket__row{ display:flex; justify-content:space-between; align-items:baseline; margin-bottom:4px; }
  .ticket__label{ font-size:12.5px; color:var(--on-ink-muted); }
  .ticket__value{ font-size:15px; font-weight:600; font-family:'Fraunces',serif; }
  .ticket__value.big{ font-size:26px; }
  .ticket__bar{ height:6px; border-radius:4px; background:rgba(247,242,231,0.14); overflow:hidden; margin:10px 0 6px; display:flex; }
  .ticket__bar span{ height:100%; }
  .ticket__foot{ font-size:11.5px; color:var(--on-ink-muted); }

  .cat-title{ font-size:13px; font-weight:700; text-transform:none; color:var(--text-muted); margin:20px 0 8px; }
  .cat-title:first-of-type{ margin-top:0; }

  .res-card{ background:#fff; border-radius:var(--radius-md); box-shadow:var(--shadow-card); padding:14px 16px; margin-bottom:10px; }
  .res-card__title{ font-size:14.5px; font-weight:700; margin:0 0 2px; }
  .res-card__sub{ font-size:12.5px; color:var(--text-muted); margin:0 0 10px; }
  .res-card__amounts{ display:flex; gap:8px; flex-wrap:wrap; margin-bottom:10px; }
  .pill{ font-size:11.5px; padding:3px 9px; border-radius:20px; font-weight:600; white-space:nowrap; }
  .pill.total{ background:var(--paper-2); color:var(--text); }
  .pill.paid{ background:var(--jade-soft); color:var(--jade-ink); }
  .pill.due{ background:var(--vermilion-soft); color:var(--vermilion-ink); }
  .pill.free{ background:var(--gold-soft); color:var(--gold); }

  .ref-box{
    font-family:ui-monospace, SFMono-Regular, Menlo, monospace; font-size:12px; background:var(--paper);
    border:1px solid var(--paper-line); border-radius:var(--radius-sm); padding:8px 10px; white-space:pre-wrap;
    display:flex; justify-content:space-between; gap:10px; align-items:flex-start; margin-bottom:8px;
  }
  .copy-btn{
    flex:none; font-family:'Inter',sans-serif; font-size:11px; font-weight:600; background:var(--ink);
    color:var(--on-ink); border:none; border-radius:20px; padding:5px 10px; cursor:pointer;
  }
  .copy-btn.copied{ background:var(--jade); }
  details.notes{ font-size:12.5px; color:var(--text-muted); }
  details.notes summary{ cursor:pointer; font-weight:600; color:var(--text); list-style:none; }
  details.notes summary::-webkit-details-marker{ display:none; }
  details.notes summary::before{ content:'Detalles · '; font-weight:600; color: var(--jade-ink); }
  details.notes p{ margin:8px 0 0; white-space:pre-line; }

  /* ---------- PREPARAR ---------- */
  .prep-hero{ background:var(--ink); color:var(--on-ink); border-radius:var(--radius-lg); padding:18px; margin-bottom:16px; overflow:hidden; position:relative; }
  .prep-hero::after{ content:'旅'; position:absolute; right:12px; top:-24px; font-family:'Fraunces',serif; font-size:112px; color:rgba(247,242,231,.055); }
  .prep-eyebrow{ font-size:11px; font-weight:700; color:var(--gold-fill); text-transform:uppercase; letter-spacing:.08em; }
  .prep-title{ font-size:24px; margin:4px 0 6px; line-height:1.08; }
  .prep-copy{ max-width:460px; margin:0; color:var(--on-ink-muted); font-size:13px; line-height:1.5; position:relative; z-index:1; }
  .trip-snapshot{ display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin:0 0 20px; }
  .snapshot-card{ background:#fff; border-radius:var(--radius-md); box-shadow:var(--shadow-card); padding:11px 10px; text-align:center; }
  .snapshot-num{ display:block; font-family:'Fraunces',serif; font-size:21px; font-weight:700; }
  .snapshot-label{ display:block; font-size:10.5px; color:var(--text-muted); line-height:1.25; margin-top:2px; }
  .prep-heading{ font-family:'Fraunces',serif; font-size:20px; margin:22px 0 10px; }
  .alert-stack{ display:grid; gap:8px; }
  .travel-alert{ background:#fff; border:1px solid var(--paper-line); border-left:4px solid var(--gold-fill); border-radius:var(--radius-md); padding:12px 13px; box-shadow:var(--shadow-card); }
  .travel-alert.urgent{ border-left-color:var(--vermilion); background:linear-gradient(90deg, rgba(168,58,44,.055), #fff 34%); }
  .travel-alert__top{ display:flex; align-items:center; gap:7px; }
  .travel-alert__tag{ font-size:10px; font-weight:800; text-transform:uppercase; letter-spacing:.06em; color:var(--vermilion-ink); }
  .travel-alert__title{ font-size:13.5px; font-weight:700; }
  .travel-alert__copy{ font-size:12.5px; color:var(--text-muted); line-height:1.48; margin:5px 0 0; }
  .travel-alert__copy a{ color:var(--jade-ink); font-weight:700; }
  .checklist{ display:grid; gap:7px; }
  .check-row{ display:flex; align-items:flex-start; gap:10px; background:#fff; border:1px solid var(--paper-line); border-radius:var(--radius-md); padding:11px 12px; cursor:pointer; }
  .check-row input{ width:19px; height:19px; flex:none; margin:0; accent-color:var(--jade); }
  .check-row span{ font-size:13px; line-height:1.42; }
  .check-row:has(input:checked) span{ color:var(--text-muted); text-decoration:line-through; text-decoration-color:rgba(97,111,95,.45); }
  .check-progress{ height:7px; overflow:hidden; background:var(--paper-2); border-radius:9px; margin:0 0 10px; }
  .check-progress span{ display:block; height:100%; width:0; background:var(--jade); border-radius:inherit; transition:width .25s ease; }
  .check-meta{ font-size:12px; color:var(--text-muted); margin:-4px 0 9px; }
  .pack-grid{ display:grid; grid-template-columns:repeat(2,1fr); gap:8px; }
  .pack-card{ background:#fff; border-radius:var(--radius-md); border:1px solid var(--paper-line); padding:12px; }
  .pack-icon{ font-size:19px; }
  .pack-title{ font-size:13px; font-weight:700; margin:5px 0 3px; }
  .pack-copy{ font-size:12px; color:var(--text-muted); line-height:1.45; margin:0; }
  .climate-arc{ background:#fff; border-radius:var(--radius-lg); box-shadow:var(--shadow-card); padding:14px; }
  .arc-row{ display:grid; grid-template-columns:74px 1fr auto; gap:9px; align-items:center; padding:8px 0; border-top:1px dashed var(--paper-line); }
  .arc-row:first-child{ border-top:none; }
  .arc-place{ font-size:12px; font-weight:700; }
  .arc-bar{ height:8px; border-radius:8px; background:var(--paper-2); position:relative; overflow:hidden; }
  .arc-bar span{ position:absolute; top:0; bottom:0; border-radius:inherit; background:linear-gradient(90deg,var(--jade),var(--gold-fill),var(--vermilion)); }
  .arc-temp{ font-size:11.5px; color:var(--text-muted); white-space:nowrap; }
  .source-box{ margin:20px 0 4px; padding:12px 13px; border-radius:var(--radius-md); background:var(--paper-2); font-size:11.5px; color:var(--text-muted); line-height:1.55; }
  .source-box a{ color:var(--jade-ink); font-weight:700; }

  @media (hover:hover) and (pointer:fine){
    .day-card:hover, .res-card:hover{ transform:translateY(-1px); box-shadow:0 3px 5px rgba(20,24,18,.08),0 12px 24px -14px rgba(20,24,18,.35); }
    nav.tabs button:hover{ background:rgba(247,242,231,.07); }
  }

  @media (max-width:390px){
    header.top{ padding:17px 15px 14px; }
    .top__title{ font-size:23px; }
    .top__dates{ margin-bottom:12px; }
    main{ padding-left:12px; padding-right:12px; }
    .day-card__head{ padding:13px 12px 9px; gap:9px; }
    .day-card__body{ padding:0 12px 14px; }
    .status-chip{ font-size:0; }
    .status-chip::after{ font-size:13px; content:'✓'; }
    .status-chip.pending::after{ content:'!'; }
    nav.tabs{ padding-left:8px; padding-right:8px; }
    nav.tabs button{ font-size:10.5px; padding-left:2px; padding-right:2px; }
    .pack-grid{ grid-template-columns:1fr; }
  }

  @media (prefers-reduced-motion: reduce){
    html{ scroll-behavior:auto; }
    *,*::before,*::after{ animation-duration:.01ms !important; animation-iteration-count:1 !important; transition-duration:.01ms !important; }
    .panel.active{ animation:none; }
  }

  @media (min-width:641px){
    body{ background:var(--paper-2); }
    .app{ background:var(--paper); min-height:100vh; box-shadow:0 0 40px rgba(0,0,0,0.06); }
  }

<script>
(function(){
  "use strict";
  var DATA = JSON.parse(document.getElementById('trip-data').textContent);
  var GUIDE = JSON.parse(document.getElementById('trip-guide').textContent);
  var PDF_B64 = JSON.parse(document.getElementById('trip-pdfs').textContent);

  // 1 AUD = 0.72 USD aprox. (tasa de mercado, principios de sep. 2026 — todas las reservas
  // originales estaban cotizadas en AUD, así que convertimos para mostrar todo en USD)
  var AUD_TO_USD = 0.72;

  var LEG = {
    VN: { name: "Vietnam", color: "var(--jade)", country: "Vietnam" },
    TW: { name: "Taiwán", color: "var(--gold-fill)", country: "Taiwan" },
    JP: { name: "Japón", color: "var(--vermilion)", country: "Japan" }
  };
  var MONTHS = { "Nov": 10, "Dic": 11 };
  var YEAR = 2026;

  /* ============ BANDERAS (SVG propio, sin depender de fuentes emoji) ============ */
  function flagSVG(kind, size){
    size = size || 22;
    var h = Math.round(size * 20/30);
    if(kind === 'VN'){
      return '<svg width="'+size+'" height="'+h+'" viewBox="0 0 30 20" class="flag-icon" aria-hidden="true">' +
        '<rect width="30" height="20" rx="2.5" fill="#da251d"/>' +
        '<polygon points="15.00,3.40 16.48,7.96 21.28,7.96 17.40,10.78 18.88,15.34 15.00,12.52 11.12,15.34 12.60,10.78 8.72,7.96 13.52,7.96" fill="#ffcd00"/>' +
        '</svg>';
    }
    if(kind === 'TW'){
      var rayPts = ["7.00,2.90 7.50,5.30 6.50,5.30","9.15,3.48 8.38,5.80 7.52,5.30","10.72,5.05 8.90,6.68 8.40,5.82",
        "11.30,7.20 8.90,7.70 8.90,6.70","10.72,9.35 8.40,8.58 8.90,7.72","9.15,10.92 7.52,9.10 8.38,8.60",
        "7.00,11.50 6.50,9.10 7.50,9.10","4.85,10.92 5.62,8.60 6.48,9.10","3.28,9.35 5.10,7.72 5.60,8.58",
        "2.70,7.20 5.10,6.70 5.10,7.70","3.28,5.05 5.60,5.82 5.10,6.68","4.85,3.48 6.48,5.30 5.62,5.80"];
      var rays = rayPts.map(function(p){ return '<polygon points="'+p+'" fill="#fff"/>'; }).join('');
      return '<svg width="'+size+'" height="'+h+'" viewBox="0 0 30 20" class="flag-icon" aria-hidden="true">' +
        '<rect width="30" height="20" rx="2.5" fill="#fe0000"/>' +
        '<path d="M0 2.5A2.5 2.5 0 0 1 2.5 0H15V11.4H0V2.5Z" fill="#000095"/>' +
        rays +
        '<circle cx="7" cy="7.2" r="1.75" fill="none" stroke="#fff" stroke-width="1.05"/>' +
        '</svg>';
    }
    if(kind === 'JP'){
      return '<svg width="'+size+'" height="'+h+'" viewBox="0 0 30 20" class="flag-icon" aria-hidden="true">' +
        '<rect width="30" height="20" rx="2.5" fill="#fff" stroke="var(--paper-line)" stroke-width="0.5"/>' +
        '<circle cx="15" cy="10" r="6" fill="#bc002d"/>' +
        '</svg>';
    }
    return '';
  }

  var PIN_SVG = '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" class="pin-ic"><path d="M12 22s7-7.58 7-12.5A7 7 0 0 0 5 9.5C5 14.42 12 22 12 22Z"/><circle cx="12" cy="9.5" r="2.3"/></svg>';
  var DOC_SVG = '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" class="pin-ic"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8Z"/><path d="M14 2v6h6"/></svg>';

  /* ============ PDFs adjuntos (comprobantes reales, embebidos en el archivo) ============ */
  var PDF_LABELS = {
    perth_hanoi: "Ticket Perth → Hanoi",
    tokyo_hanoi: "Ticket Tokyo → Hanoi",
    hanoi_danang: "Ticket Hanoi → Da Nang",
    danang_taipei_osaka: "Ticket Da Nang → Taipei → Osaka",
    narita_christchurch: "Ticket Narita → Christchurch",
    ba_tokyo: "Ticket Buenos Aires ⇄ Tokyo",
    restaurante_tam_vi: "Reserva Tầm Vị"
  };

  var PDF_URLS={
    perth_hanoi:'https://drive.google.com/file/d/1NKUVLbh5ionuN_2KO-xt08KpgIQ22xRJ/view',
    tokyo_hanoi:'https://drive.google.com/file/d/1epa4TfSMFw4SnvViT5SvbL_CLl4Vz0HR/view',
    hanoi_danang:'https://drive.google.com/file/d/1VoaAjVU37ww15meZJN384EL8VbDfBGLw/view',
    danang_taipei_osaka:'https://drive.google.com/file/d/1kC8V2_taDyDbymZs7UgcHstWifJdIfkH/view',
    narita_christchurch:'https://drive.google.com/file/d/114hX3KXnVZ3X6RVZ-6EtL1lZiOT0lHlh/view',
    ba_tokyo:'https://drive.google.com/file/d/1CxbJIkYF9iUSpdSvRF-lIib_DkuDsZX5/view',
    restaurante_tam_vi:'https://drive.google.com/file/d/16oDmT-qAbgConRoP885jK4hGsZ0VHr-R/view'
  };
  function pdfChip(key,labelOverride){
    var href=PDF_URLS[key];if(!href)return '';
    var label=labelOverride||PDF_LABELS[key]||'Ver comprobante';
    return ' <a class="pdf-chip maps-chip" href="'+href+'" target="_blank" rel="noopener noreferrer">'+DOC_SVG+' '+esc(label)+'</a>';
  }

  /* ============ GOOGLE MAPS ============ */
  // Direcciones / coordenadas tal como figuran en el excel original (nada inventado).
  var ACCOM_MAPS = [
    { match: "High-ser Apartment", query: "High-ser Apartment, Dong Da, Ha Noi, Vietnam" },
    { match: "B'Lan Riverside Villa", query: "B'Lan Riverside Villa, Hoi An, Vietnam" },
    { match: "Guide Hotel Taipei Xinyi", query: "Guide Hotel Taipei Xinyi, No. 15-2, Sec. 2, Keelung Rd, Xinyi District, Taipei 110, Taiwan" },
    { match: "GRAND HOSTEL LDK", query: "GRAND HOSTEL LDK Osaka Shinsaibashi, Shimanouchi 1-14-29, Chuo Ward, Osaka, Japan" },
    { match: "Kyoto Ann", query: "4-1 Minamisannocho, Higashikujo, Minami Ward, Kyoto, 601-8011, Japan" },
    { match: "Santiago Guesthouse Hiroshima", lat: 34.39038, lng: 132.4593 },
    { match: "Chisun Grand Takayama", lat: 36.1417, lng: 137.25288 },
    { match: "Hakone Pax Yoshino", query: "Hakone Pax Yoshino, 139-5 Yumoto Chaya, Hakone-machi, Ashigarashimo-gun, Kanagawa 250-0312, Japan" },
    { match: "Rimon Apartment", lat: 35.71018, lng: 139.7942 },
    { match: "Tầm Vị", query: "Tầm Vị Restaurant, 4b Phố Yên Thế, Van Mieu - Quoc Tu Giam, Ha Noi, Vietnam" }
  ];

  function mapsHref(spec){
    if(spec.lat !== undefined){
      return "https://www.google.com/maps/search/?api=1&query=" + spec.lat + "," + spec.lng;
    }
    return "https://www.google.com/maps/search/?api=1&query=" + encodeURIComponent(spec.query);
  }

  function findAccomMaps(stayOrDesc){
    for(var i=0;i<ACCOM_MAPS.length;i++){
      if(stayOrDesc.indexOf(ACCOM_MAPS[i].match) !== -1) return ACCOM_MAPS[i];
    }
    return null;
  }

  function accomMapsLink(text){
    var spec = findAccomMaps(text || "");
    if(!spec) return "";
    return ' <a class="maps-chip" href="' + mapsHref(spec) + '" target="_blank" rel="noopener">' + PIN_SVG + ' Ver alojamiento en Maps</a>';
  }

  function splitPlaces(placeStr){
    var cleaned = placeStr.replace(/\(day trip\)/i, "").trim();
    var parts = cleaned.split(/→|\+/).map(function(p){
      return p.replace(/[()]/g, "").trim();
    }).filter(Boolean);
    return parts;
  }

  // País real de cada ciudad — necesario porque en los días de tránsito (ej. día 12,
  // Hoi An → Da Nang → Taipei) el "leg" del día no es el país de todas las ciudades nombradas.
  var CITY_COUNTRY = {
    "Ha Long Bay": "Vietnam", "Ha Giang": "Vietnam", "Hanoi": "Vietnam", "Hoi An": "Vietnam",
    "Da Nang": "Vietnam", "Hue": "Vietnam",
    "Taipei": "Taiwan",
    "Shirakawa-go": "Japan", "Osaka": "Japan", "Kyoto": "Japan", "Nara": "Japan", "Himeji": "Japan",
    "Hiroshima": "Japan", "Miyajima": "Japan", "Nagoya": "Japan", "Takayama": "Japan", "Hakone": "Japan",
    "Tokyo": "Japan", "Enoshima": "Japan"
  };
  var CITY_KEYS_BY_LENGTH = Object.keys(CITY_COUNTRY).sort(function(a,b){ return b.length - a.length; });

  function countryFor(placeSegment, fallbackCountry){
    for(var i=0;i<CITY_KEYS_BY_LENGTH.length;i++){
      var key = CITY_KEYS_BY_LENGTH[i];
      if(placeSegment.indexOf(key) !== -1) return CITY_COUNTRY[key];
    }
    return fallbackCountry;
  }

  function placeChips(placeStr, leg){
    var parts = splitPlaces(placeStr);
    var fallback = LEG[leg].country;
    return parts.map(function(p){
      var country = countryFor(p, fallback);
      var href = "https://www.google.com/maps/search/?api=1&query=" + encodeURIComponent(p + ", " + country);
      return '<a class="place-chip" href="' + href + '" target="_blank" rel="noopener">' + PIN_SVG + ' ' + esc(p) + '</a>';
    }).join('');
  }

  /* ============ FECHAS ============ */
  function parseFecha(label){
    if(!label) return null;
    var m = label.match(/(\d{1,2})\s*(Nov|Dic)/i);
    if(!m) return null;
    var mon = MONTHS[m[2].charAt(0).toUpperCase() + m[2].slice(1,3).toLowerCase()];
    if(mon === undefined) return null;
    return new Date(YEAR, mon, parseInt(m[1], 10));
  }

  function sameDay(a,b){
    return a && b && a.getFullYear()===b.getFullYear() && a.getMonth()===b.getMonth() && a.getDate()===b.getDate();
  }

  /* ============ TEXTO / MONEDA ============ */
  function esc(str){
    if(str === null || str === undefined) return "";
    return String(str).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
  }

  function convertAudMentions(text){
    if(typeof text !== 'string') return text;
    return text.replace(/(~)?AUD\s*(~)?\s*(\d{1,3}(?:\.\d{3})*(?:,\d+)?)/g, function(full, t1, t2, numStr){
      var tilde = t1 || t2 || '';
      var hasDecimal = numStr.indexOf(',') !== -1;
      var normalized = numStr.replace(/\./g,'').replace(',', '.');
      var val = parseFloat(normalized) * AUD_TO_USD;
      var decimals = hasDecimal ? 2 : 0;
      var formatted = val.toLocaleString('es-AR', { minimumFractionDigits: decimals, maximumFractionDigits: 2 });
      return tilde + 'USD ' + formatted;
    });
  }

  function escConv(str){ return esc(convertAudMentions(str)); }

  function nl2br(str){
    return escConv(str).replace(/\n/g, "<br>");
  }

  function fmtUSD(m, opts){
    opts = opts || {};
    if(!m) return "—";
    if(m.num === null || m.num === undefined){
      return convertAudMentions(m.label || m.raw || "—");
    }
    var n = (m.currency === 'USD') ? m.num : m.num * AUD_TO_USD;
    var decimals = (Math.abs(n % 1) > 0.001) ? 2 : 0;
    var str = n.toLocaleString('es-AR', { minimumFractionDigits: decimals, maximumFractionDigits: 2 });
    var prefix = (m.approx && !opts.noApprox) ? "~" : "";
    return prefix + "USD " + str;
  }

  function fmtLocal(n, cur){
    if(n === null || n === undefined) return "—";
    if(typeof n === "string") return n + (cur ? " " + cur : "");
    return n.toLocaleString('es-AR') + " " + cur;
  }

  /* ============ ITINERARIO ============ */
  function findHorarioDay(dateLabel){
    for(var r=0; r<DATA.horarios.length; r++){
      var region = DATA.horarios[r];
      for(var d=0; d<region.days.length; d++){
        if(region.days[d].date === dateLabel) return region.days[d];
      }
    }
    return null;
  }

  function scheduleHtmlFor(day, horario, forceOpen){
    if(!horario || !horario.entries.length) return "";
    var items = horario.entries.map(function(e){
      return '<li><span class="hora">' + esc(e.hora) + '</span><span class="act">' + escConv(e.actividad) +
             (e.notas ? '<span class="nota">' + escConv(e.notas) + '</span>' : '') + '</span></li>';
    }).join('');
    return '<details class="schedule"' + (forceOpen ? ' open' : '') + '>' +
        '<summary><svg class="chev" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M9 6l6 6-6 6"/></svg> Ver horario del día</summary>' +
        (horario.note ? '<div class="day-note">' + escConv(horario.note) + '</div>' : '') +
        '<ul class="hours">' + items + '</ul>' +
      '</details>';
  }

  function weatherHtmlFor(day){
    var w = GUIDE.weather[String(day.num)];
    if(!w) return '';
    return '<div class="day-weather" aria-label="Clima esperado, no pronóstico">' +
        '<div class="weather-temp">' + esc(w.temp) + '</div>' +
        '<div><div class="weather-kicker">Climatología esperada</div>' +
        '<div class="weather-copy"><strong>' + esc(w.title) + '.</strong> ' + esc(w.copy) + '</div></div>' +
      '</div>';
  }

  function recommendationsHtmlFor(day){
    var recs = GUIDE.recommendations[String(day.num)] || [];
    if(!recs.length) return '';
    var cards = recs.map(function(r){
      var actions = '';
      if(r.query){
        actions += '<a class="action-link" href="' + mapsHref({query:r.query}) + '" target="_blank" rel="noopener">' + PIN_SVG + ' Google Maps</a>';
      }
      if(r.url){
        actions += '<a class="action-link" href="' + esc(r.url) + '" target="_blank" rel="noopener">' + esc(r.label || 'Sitio oficial') + '</a>';
      }
      return '<article class="reco-card"><div class="reco-top"><div>' +
          '<div class="reco-type">' + esc(r.type) + '</div><div class="reco-title">' + esc(r.title) + '</div>' +
        '</div></div><p class="reco-copy">' + esc(r.why) + '</p>' +
        (actions ? '<div class="reco-actions">' + actions + '</div>' : '') + '</article>';
    }).join('');
    return '<details class="day-guide"><summary><svg class="chev" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M9 6l6 6-6 6"/></svg>' +
        'Lo mejor cerca · ' + recs.length + (recs.length === 1 ? ' recomendación' : ' recomendaciones') + '</summary>' +
        '<div class="reco-list">' + cards + '</div>' +
        '<p class="guide-note">Selección curada para esta ruta; verificá horarios y reservas cerca de la fecha.</p></details>';
  }

  function dayBodyHtml(day, horario, forceScheduleOpen){
    var accomLink = accomMapsLink(day.stay);
    var dayPdfChips = (day.pdfs || []).map(function(k){ return pdfChip(k); }).join('');
    return '<h3 class="day-card__place">' + esc(day.place) + '</h3>' +
        '<div class="chip-row">' + placeChips(day.place, day.leg) + '</div>' +
        weatherHtmlFor(day) +
        '<p class="day-card__activity">' + escConv(day.activity) + '</p>' +
        '<p class="day-card__stay"><span class="ic">🛏</span><span>' + escConv(day.stay) + '</span></p>' +
        (accomLink || dayPdfChips ? '<div class="chip-row">' + accomLink + dayPdfChips + '</div>' : '') +
        recommendationsHtmlFor(day) +
        scheduleHtmlFor(day, horario, forceScheduleOpen);
  }

  function todayPinHtml(day, horario){
    return '<div class="today-pin" data-leg="' + day.leg + '">' +
        '<div class="today-pin__tag">📍 Hoy · Día ' + day.num + ' de 30</div>' +
        '<div class="day-card__date" style="margin-bottom:10px;">' + esc(day.date) + '</div>' +
        dayBodyHtml(day, horario, true) +
      '</div>';
  }

  function upcomingCardHtml(day){
    return '<button type="button" class="upcoming-card" data-jump="' + day.num + '">' +
        '<span class="upcoming-card__badge">' + day.num + '</span>' +
        '<span class="upcoming-card__text">' +
          '<span class="upcoming-card__date">' + esc(day.date) + ' · ' + esc(day.place) + '</span>' +
          '<span class="upcoming-card__activity">' + escConv(day.activity) + '</span>' +
        '</span>' +
      '</button>';
  }

  function renderItinerario(today){
    var el = document.getElementById('panel-itinerario');
    var html = "";
    var curLeg = null;
    var legCounts = { VN:0, TW:0, JP:0 };
    DATA.days.forEach(function(d){ legCounts[d.leg] = (legCounts[d.leg]||0) + 1; });

    var legClimate = {};
    DATA.horarios.forEach(function(region){
      var key = region.label.indexOf("VIETNAM")===0 ? "VN" : (region.label.indexOf("TAIWAN")===0 ? "TW" : "JP");
      legClimate[key] = { note: region.note, climate: region.climate };
    });

    var todayIdx = DATA.days.findIndex(function(d){ return sameDay(parseFecha(d.date), today); });

    if(todayIdx !== -1){
      var todayDay = DATA.days[todayIdx];
      html += todayPinHtml(todayDay, findHorarioDay(todayDay.date));
      var upcoming = DATA.days.slice(todayIdx+1, todayIdx+3);
      if(upcoming.length){
        html += '<div class="upcoming-label">Próximos días</div>';
        html += '<div class="upcoming-list">' + upcoming.map(upcomingCardHtml).join('') + '</div>';
      }
      html += '<div class="section-divider">Itinerario completo</div>';
    }

    DATA.days.forEach(function(day, idx){
      var isToday = idx === todayIdx;
      if(day.leg !== curLeg){
        curLeg = day.leg;
        var meta = LEG[curLeg];
        var cl = legClimate[curLeg] || {};
        html += '<div class="leg-banner">' +
                  flagSVG(curLeg, 26) +
                  '<span class="leg-banner__label">' + meta.name + '</span>' +
                  '<span class="leg-banner__meta">' + legCounts[curLeg] + (legCounts[curLeg]===1 ? ' día' : ' días') + '</span>' +
                '</div>';
        if(cl.climate || cl.note){
          html += '<div class="leg-banner__sub">' + [cl.climate, cl.note].filter(Boolean).map(escConv).join(' · ') + '</div>';
        }
      }
      var statusOk = /✅/.test(day.status);
      var statusChip = statusOk
        ? '<span class="status-chip confirmed">✅ Confirmado</span>'
        : '<span class="status-chip pending">⏳ Pendiente</span>';

      var horario = findHorarioDay(day.date);

      html += '<details id="day-' + day.num + '" class="day-card' + (isToday ? ' is-today' : '') + '" data-leg="' + day.leg + '"' + (isToday ? ' open' : '') + '>' +
          '<summary class="day-card__head">' +
            '<div class="day-card__badge">' + String(day.num).padStart(2,'0') + '</div>' +
            '<div class="day-card__headtext">' +
              '<div class="day-card__daynum">Día ' + day.num + ' de 30</div>' +
              '<div class="day-card__date">' + esc(day.date) + (isToday ? '<span class="day-card__today-chip">HOY</span>' : '') + '</div>' +
            '</div>' +
            statusChip +
            '<svg class="day-card__chev" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M9 6l6 6-6 6"/></svg>' +
          '</summary>' +
          '<div class="day-card__body">' + dayBodyHtml(day, horario, isToday) + '</div>' +
        '</details>';
    });
    el.innerHTML = html;

    el.querySelectorAll('[data-jump]').forEach(function(btn){
      btn.addEventListener('click', function(){
        var target = document.getElementById('day-' + btn.getAttribute('data-jump'));

        target.scrollIntoView({ behavior: 'smooth', block: 'start' });

  /* ============ RESERVAS ============ */
  function categorize(desc){
    var d = desc.toLowerCase();
    if(d.indexOf('vuelo') !== -1) return 'Vuelos';
    if(d.indexOf('alojamiento') !== -1 || d.indexOf('depto') !== -1) return 'Alojamiento';
    if(d.indexOf('cena') !== -1 || d.indexOf('restaurante') !== -1 || d.indexOf('almuerzo') !== -1) return 'Restaurantes';
    if(d.indexOf('free tour') !== -1 || d.indexOf('crucero') !== -1 || d.indexOf('loop') !== -1 || d.indexOf('disneysea') !== -1) return 'Tours y excursiones';
    return 'Otros';
  }

  function renderReservas(){
    var el=document.getElementById('panel-reservas'),html='';
    var cats={'Vuelos':[],'Alojamiento':[],'Restaurantes':[],'Tours y excursiones':[],'Otros':[]};
    DATA.reservas.forEach(function(r){cats[categorize(r.desc)].push(r);});
    Object.keys(cats).forEach(function(cat){
      if(!cats[cat].length)return;
      html+='<div class="cat-title">'+esc(cat)+'</div>';
      cats[cat].forEach(function(r){
        var lines=(r.desc||'').split('\n'),title=lines[0],sub=lines.slice(1).join(' · ');
        var spec=findAccomMaps(r.desc)||findAccomMaps(r.proveedor||'');
        var mapLink=spec?' <a class="maps-chip" href="'+mapsHref(spec)+'" target="_blank" rel="noopener">'+PIN_SVG+' Ver en Maps</a>':'';
        var pdfLink=r.pdf?pdfChip(r.pdf):'';
        if(/DisneySea/i.test(r.desc))mapLink+=' <a class="maps-chip" href="https://www.tokyodisneyresort.jp/en/tds/" target="_blank" rel="noopener">🎢 Sitio oficial</a>';
        var chips=(mapLink||pdfLink)?'<div class="chip-row">'+mapLink+pdfLink+'</div>':'';
        var ref=r.referencia?'<div class="ref-box"><span>'+nl2br(r.referencia)+'</span><button class="copy-btn" data-copy="'+esc(r.referencia.replace(/\n/g,' · '))+'">Copiar</button></div>':'';
        var notes=r.notas?'<details class="notes"><summary></summary><p>'+escConv(r.notas)+'</p></details>':'';
        html+='<div class="res-card"><p class="res-card__title">'+esc(title)+'</p><p class="res-card__sub">'+esc(r.proveedor||'')+(sub?' · '+escConv(sub):'')+'<br>'+escConv(r.fechas||'')+'</p>'+chips+ref+notes+'</div>';
      });
    });
    el.innerHTML=html;
    el.querySelectorAll('.copy-btn').forEach(function(btn){
      btn.addEventListener('click',function(){
        var val=btn.getAttribute('data-copy');
        var done=function(){btn.textContent='Copiado ✓';btn.classList.add('copied');setTimeout(function(){btn.textContent='Copiar';btn.classList.remove('copied');},1500);};
        if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(val).then(done).catch(function(){fallbackCopy(val,done);});
        else fallbackCopy(val,done);
      });
    });
  }

  function fallbackCopy(text, cb){
    var ta = document.createElement('textarea');
    ta.value = text; ta.style.position='fixed'; ta.style.opacity='0';
    document.body.appendChild(ta); ta.select();
    try{ document.execCommand('copy'); }catch(e){}
    document.body.removeChild(ta);
    cb();
  }

  function setupPrepChecks(){
    var storageKey = 'viaje-asia-2026-checklist-v2';
    var saved = {};
    try{ saved = JSON.parse(localStorage.getItem(storageKey) || '{}'); }catch(e){ saved = {}; }
    var boxes = document.querySelectorAll('[data-prep-check]');
    boxes.forEach(function(box){
      var key = box.getAttribute('data-prep-check');
      box.checked = !!saved[key];
      box.addEventListener('change', function(){
        saved[key] = box.checked;
        try{ localStorage.setItem(storageKey, JSON.stringify(saved)); }catch(e){}
        updatePrepProgress(boxes);
      });
    });
    updatePrepProgress(boxes);
  }

  function updatePrepProgress(boxes){
    var done = Array.prototype.filter.call(boxes, function(b){ return b.checked; }).length;
    var meta = document.getElementById('check-meta');
    var fill = document.getElementById('check-progress-fill');
    if(meta) meta.textContent = done + ' de ' + boxes.length + ' listos';
    if(fill) fill.style.width = (boxes.length ? done / boxes.length * 100 : 0) + '%';
  }

  /* ============ HEADER / PROGRESS ============ */
  function renderHeader(today){
    var first = parseFecha(DATA.days[0].date);
    var last = parseFecha(DATA.days[DATA.days.length-1].date);
    var lastEnd = new Date(last.getTime() + 24*3600*1000);

    document.getElementById('date-range').textContent =
      DATA.days[0].date.split(' ').slice(1).join(' ') + ' – ' + DATA.days[DATA.days.length-1].date.split(' ').slice(1).join(' ');

    var legOrder = ['VN','TW','JP'];
    var counts = {VN:0,TW:0,JP:0};
    DATA.days.forEach(function(d){ counts[d.leg]++; });
    var total = DATA.days.length;
    var bar = document.getElementById('progress-bar');
    bar.innerHTML = legOrder.map(function(k){
      return '<span class="progress__seg" style="width:' + (counts[k]/total*100) + '%;background:' + LEG[k].color + '"></span>';
    }).join('');

    var flagsRow = document.getElementById('top-flags');
    flagsRow.innerHTML = legOrder.map(function(k, i){
      return flagSVG(k, 18) + (i < legOrder.length-1 ? '<span class="flag-arrow">→</span>' : '');
    }).join('');

    var statusEl = document.getElementById('trip-status');
    if(today < first){
      var diffDays = Math.ceil((first - today) / 86400000);
      statusEl.innerHTML = '<strong>Faltan ' + diffDays + ' día' + (diffDays===1?'':'s') + '</strong> para el despegue';
    } else if(today >= first && today < lastEnd){
      var idx = DATA.days.findIndex(function(d){ return sameDay(parseFecha(d.date), today); });
      var markerPct = idx >= 0 ? ((idx + 0.5) / total * 100) : 0;
      var marker = document.createElement('div');
      marker.className = 'progress__marker';
      marker.style.left = markerPct + '%';
      bar.appendChild(marker);
      if(idx >= 0){
        statusEl.innerHTML = '<strong>Día ' + (idx+1) + ' de ' + total + '</strong> · ' + esc(DATA.days[idx].place);
      } else {
        statusEl.innerHTML = 'En viaje';
      }
    } else {
      statusEl.innerHTML = '✈️ Viaje completado — esperamos que haya sido increíble';
    }
  }

  /* ============ TABS ============ */
  function setupTabs(){
    var btns = Array.prototype.slice.call(document.querySelectorAll('.tab-btn'));
    function activate(btn, focus){
      btns.forEach(function(b){
        var active = b === btn;
        b.classList.toggle('active', active);
        b.setAttribute('aria-selected', active ? 'true' : 'false');
        b.setAttribute('tabindex', active ? '0' : '-1');
        var panel = document.getElementById('panel-' + b.getAttribute('data-tab'));
        panel.classList.toggle('active', active);
        panel.hidden = !active;
      });
      if(focus) btn.focus();
      var cover = document.querySelector('.cover');
      window.scrollTo({top:cover ? cover.offsetHeight : 0, behavior:'auto'});
    }
    btns.forEach(function(btn){
      btn.addEventListener('click', function(){
        activate(btn, false);
      });
      btn.addEventListener('keydown', function(e){
        if(e.key !== 'ArrowRight' && e.key !== 'ArrowLeft' && e.key !== 'Home' && e.key !== 'End') return;
        e.preventDefault();
        var idx = btns.indexOf(btn);
        if(e.key === 'Home') idx = 0;
        else if(e.key === 'End') idx = btns.length - 1;
        else idx = (idx + (e.key === 'ArrowRight' ? 1 : -1) + btns.length) % btns.length;
        activate(btns[idx], true);
      });
    });
  }

  function setupCompactHeader(){
    var header=document.querySelector('header.top');
    var cover=document.querySelector('.cover');
    if(!header)return;
    var pending=false;
    var compact=false;
    var topLimit=Math.max(85,(cover?cover.offsetHeight:140)+28);
    var bottomLimit=Math.max(36,topLimit-65);
    function update(){
      var y=window.scrollY||0;
      var next=compact?(y>bottomLimit):(y>topLimit);
      if(next!==compact){
        compact=next;
        header.classList.toggle('is-compact',compact);
      }
      pending=false;
    }
    window.addEventListener('scroll',function(){
      if(!pending){pending=true;requestAnimationFrame(update);}
    },{passive:true});
    update();
  }

  function init(){
    var today = new Date();
    renderHeader(today);
    renderItinerario(today);
    renderReservas();
    renderEfectivo();
    renderPreparar();
    setupTabs();
    setupCompactHeader();
  }

  if(document.readyState === 'loading'){
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }
})();
