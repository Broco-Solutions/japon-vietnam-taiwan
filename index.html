<script>
(function(){
'use strict';
var frame=document.getElementById('site'),boot=document.getElementById('boot');
var PDF_LINKS=[
{match:'Perth → Hanoi',url:'https://drive.google.com/file/d/1NKUVLbh5ionuN_2KO-xt08KpgIQ22xRJ/view?usp=sharing'},
{match:'Tokyo → Hanoi',url:'https://drive.google.com/file/d/1epa4TfSMFw4SnvViT5SvbL_CLl4Vz0HR/view?usp=sharing'},
{match:'Hanoi → Da Nang',url:'https://drive.google.com/file/d/1VoaAjVU37ww15meZJN384EL8VbDfBGLw/view?usp=sharing'},
{match:'Da Nang → Taipei → Osaka',url:'https://drive.google.com/file/d/1kC8V2_taDyDbymZs7UgcHstWifJdIfkH/view?usp=sharing'},
{match:'Narita → Christchurch',url:'https://drive.google.com/file/d/114hX3KXnVZ3X6RVZ-6EtL1lZiOT0lHlh/view?usp=sharing'},
{match:'Buenos Aires ⇄ Tokyo',url:'https://drive.google.com/file/d/1CxbJIkYF9iUSpdSvRF-lIib_DkuDsZX5/view?usp=drivesdk'},
{match:'Tầm Vị',url:'https://drive.google.com/file/d/16oDmT-qAbgConRoP885jK4hGsZ0VHr-R/view?usp=sharing'}];
var MONEY_RE=/(?:\bAUD\b|\bUSD\b|\bARS\b|[€¥$]|\bmonto\b|\bpagad\w*\b|\bpago\b|\bprepaga\w*\b|\bsaldo\b|\befectivo\b|\bpropina\b|\bgratuit\w*\b|\bgratis\b|\bcosto\b|\bprecio\b|\breembols\w*\b|\bcobrad\w*\b|\bdepósito\b|\btarjeta de crédito\b|\bgasto\b|\bdinero\b)/i;
function cleanMoneyText(text){
 if(typeof text!=='string')return text;
 text=text.replace(/\bFree tours?\b/gi,'Tour guiado').replace(/mirador GRATIS/gi,'mirador').replace(/\(todo gratis\)/gi,'');
 var parts=text.split(/(?<=[.!?])\s+/),out=[];
 parts.forEach(function(s){var chunks=s.split(/\s+(?:·|\||—)\s+/),keep=[];chunks.forEach(function(c){c=c.replace(/\s*\((?:~?\s*)?(?:AUD|USD|ARS|TWD|JPY|[€¥$])[^)]*\)/gi,'').replace(/\bGRATIS\b/gi,'').replace(/\bgratuita\b/gi,'').replace(/\s{2,}/g,' ').trim();if(c&&!MONEY_RE.test(c))keep.push(c);});if(keep.length)out.push(keep.join(' · '));});
 return out.join(' ').replace(/\s{2,}/g,' ').trim();
}
function cleanRecursive(v){if(Array.isArray(v))return v.map(cleanRecursive);if(v&&typeof v==='object'){Object.keys(v).forEach(function(k){v[k]=cleanRecursive(v[k]);});return v;}return typeof v==='string'?cleanMoneyText(v):v;}
function sanitizeTripData(doc){
 var n=doc.getElementById('trip-data'),data;if(!n)return null;try{data=JSON.parse(n.textContent);}catch(e){return null;}
 delete data.reservasTotales;delete data.efectivo;
 (data.reservas||[]).forEach(function(r){delete r.montoTotal;delete r.pagado;delete r.saldoPendiente;});data=cleanRecursive(data);
 var flights='Ida: 7 Nov · AEP 13:35 → GRU 16:20 (AC9845, GOL) · GRU 21:45 → YUL 06:10 del 8 Nov (AC97) · YUL 12:40 → NRT 16:30 del 9 Nov (AC5). Vuelta: 8 Dic · NRT 18:45 → YUL 17:00 (AC6) · YUL 20:55 → GRU 09:00 del 9 Dic (AC96) · GRU 12:15 → EZE 15:05 del 9 Dic (AC90).';
 (data.reservas||[]).forEach(function(r){if(r.num===24||r.pdf==='ba_tokyo'){r.fechas='Ida: sáb 7 Nov → llegada a Tokyo lun 9 Nov · Vuelta: mar 8 Dic → llegada a Buenos Aires mié 9 Dic';r.referencia='Airline reference: A9A9AF · AC9845 + AC97 + AC5 / AC6 + AC96 + AC90';r.notas=flights;}});
 (data.days||[]).forEach(function(d){if(d.num===30)d.activity='Papá, mamá y Renzo salen de Narita a las 18:45 en AC6 hacia Montreal (llegada 17:00). Conexión AC96: Montreal 20:55 → São Paulo 09:00 del 9 Dic. Último tramo AC90: São Paulo 12:15 → Buenos Aires Ezeiza 15:05 del 9 Dic. Álvaro + Mili pueden hacer Enoden + Enoshima solo si ya resolvieron equipaje y hotel; su vuelo a Nueva Zelanda sale el 9 Dic desde Narita (FJ451 + FJ350).';});
 n.textContent=JSON.stringify(data);try{doc.defaultView.DATA=data;}catch(e){}var pn=doc.getElementById('trip-pdfs');if(pn)pn.remove();try{doc.defaultView.PDF_B64={};}catch(e){}return data;
}
function removeMoneyUi(doc){
 var t=doc.getElementById('tab-efectivo');if(t)t.remove();var p=doc.getElementById('panel-efectivo');if(p)p.remove();
 doc.querySelectorAll('.ticket,.res-card__amounts').forEach(function(el){el.remove();});
 var w=doc.createTreeWalker(doc.body,NodeFilter.SHOW_TEXT),nodes=[];while(w.nextNode())nodes.push(w.currentNode);nodes.forEach(function(node){var raw=node.nodeValue;if(!raw||!MONEY_RE.test(raw))return;var c=cleanMoneyText(raw);if(c)node.nodeValue=c;else if(node.parentElement)node.parentElement.remove();});
 doc.querySelectorAll('.check-row').forEach(function(row){var s=(row.textContent||'').toLowerCase();if(s.indexOf('bancos')>=0||s.indexOf('tarjetas')>=0)row.remove();});
}
function injectStyles(doc){if(doc.getElementById('github-live-patch'))return;var st=doc.createElement('style');st.id='github-live-patch';st.textContent='.cover{height:clamp(122px,24vw,168px)!important;aspect-ratio:auto!important;max-height:none!important}.cover img{object-position:center 38%!important}.res-sort-note{font-size:12px;color:var(--text-muted);margin:-8px 2px 12px}.res-accordion-group{background:#fff;border:1px solid var(--paper-line);border-radius:var(--radius-lg);box-shadow:var(--shadow-card);margin:0 0 10px;overflow:hidden}.res-accordion-summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:10px;padding:13px 14px}.res-accordion-summary::-webkit-details-marker{display:none}.res-accordion-icon{width:34px;height:34px;border-radius:10px;background:var(--paper-2);display:flex;align-items:center;justify-content:center;font-size:17px;flex:none}.res-accordion-text{min-width:0;flex:1;display:flex;flex-direction:column}.res-accordion-text strong{font-size:14px}.res-accordion-text small{font-size:11.5px;color:var(--text-muted)}.res-accordion-count{min-width:25px;height:25px;padding:0 7px;border-radius:20px;background:var(--paper-2);display:flex;align-items:center;justify-content:center;font-size:11.5px;font-weight:700}.res-accordion-chev{transition:transform .2s}.res-accordion-group[open] .res-accordion-chev{transform:rotate(90deg)}.res-accordion-body{padding:2px 10px 10px;border-top:1px solid var(--paper-line)}.res-accordion-body .res-card{margin-top:10px;margin-bottom:0}.res-card__date-emphasis{font-weight:600}';doc.head.appendChild(st);}
function patchPdfLinks(doc){doc.querySelectorAll('a.pdf-chip').forEach(function(a){var txt=(a.textContent||'').replace(/\s+/g,' ').trim();PDF_LINKS.some(function(it){if(txt.indexOf(it.match)>=0){a.href=it.url;a.target='_blank';a.rel='noopener noreferrer';a.removeAttribute('download');return true;}return false;});});}
var GROUP_META={'Vuelos':{icon:'✈️',hint:'Pasajes, conexiones y comprobantes'},'Alojamiento':{icon:'🛏️',hint:'Hoteles y departamentos'},'Tours y excursiones':{icon:'🧭',hint:'Actividades y experiencias reservadas'},'Restaurantes':{icon:'🍜',hint:'Mesas y experiencias gastronómicas'},'Otros':{icon:'🎟️',hint:'Otras reservas del viaje'}},GROUP_ORDER=['Vuelos','Alojamiento','Tours y excursiones','Restaurantes','Otros'];
function groupReservations(doc){var panel=doc.getElementById('panel-reservas');if(!panel||panel.querySelector('.res-accordion-group'))return;var children=[].slice.call(panel.children),body=null,groups=[];children.forEach(function(el){if(el.classList&&el.classList.contains('cat-title')){var name=(el.textContent||'').trim(),meta=GROUP_META[name]||GROUP_META.Otros,count=0,c=el.nextElementSibling;while(c&&!(c.classList&&c.classList.contains('cat-title'))){if(c.classList&&c.classList.contains('res-card'))count++;c=c.nextElementSibling;}var d=doc.createElement('details');d.className='res-accordion-group';d.dataset.group=name;var s=doc.createElement('summary');s.className='res-accordion-summary';s.innerHTML='<span class="res-accordion-icon">'+meta.icon+'</span><span class="res-accordion-text"><strong>'+name+'</strong><small>'+meta.hint+'</small></span><span class="res-accordion-count">'+count+'</span><span class="res-accordion-chev">›</span>';body=doc.createElement('div');body.className='res-accordion-body';d.appendChild(s);d.appendChild(body);panel.insertBefore(d,el);el.remove();groups.push(d);}else if(body&&el.classList&&el.classList.contains('res-card'))body.appendChild(el);});groups.sort(function(a,b){return GROUP_ORDER.indexOf(a.dataset.group)-GROUP_ORDER.indexOf(b.dataset.group);});groups.forEach(function(g){panel.appendChild(g);});if(groups[0])groups[0].open=true;if(groups.length){var note=doc.createElement('p');note.className='res-sort-note';note.textContent='Agrupadas por tipo y ordenadas cronológicamente dentro de cada sección.';panel.insertBefore(note,groups[0]);}}
function patchFlightCard(doc){doc.querySelectorAll('.res-card').forEach(function(card){var title=card.querySelector('.res-card__title');if(!title||(title.textContent||'').indexOf('Vuelo Buenos Aires ⇄ Tokyo')<0)return;var sub=card.querySelector('.res-card__sub');if(sub)sub.innerHTML='Air Canada (vía Gotogate)<br><span class="res-card__date-emphasis">Ida: 7 Nov → NRT 9 Nov 16:30 · Vuelta: NRT 8 Dic 18:45 → EZE 9 Dic 15:05</span>';var det=card.querySelector('details.notes p');if(det)det.textContent='Ida: AEP 13:35 → GRU 16:20 (AC9845) · GRU 21:45 → YUL 06:10 del 8 Nov (AC97) · YUL 12:40 → NRT 16:30 del 9 Nov (AC5). Vuelta: NRT 18:45 → YUL 17:00 (AC6) · YUL 20:55 → GRU 09:00 del 9 Dic (AC96) · GRU 12:15 → EZE 15:05 del 9 Dic (AC90).';});}
function patchPrepare(doc){var prep=doc.getElementById('panel-preparar');if(!prep)return;var title=prep.querySelector('.prep-title');if(title)title.textContent='Listos para 33 días y cuatro climas';var first=prep.querySelector('.snapshot-card');if(first){var n=first.querySelector('.snapshot-num'),l=first.querySelector('.snapshot-label');if(n)n.textContent='33';if(l)l.textContent='días totales';}prep.querySelectorAll('.travel-alert').forEach(function(a){var t=a.querySelector('.travel-alert__title'),c=a.querySelector('.travel-alert__copy');if(t&&(t.textContent||'').indexOf('Tokyo 7–10 Nov')>=0){t.textContent='Tránsito Tokyo 9–10 Nov, tres viajeros';if(c)c.textContent='Air Canada llega a Narita el 9 Nov a las 16:30 y VJ933 sale a Hanoi el 10 Nov a las 09:30 para papá, mamá y Renzo. Resolver una noche de tránsito y traslado con acceso simple a Narita.';}});}
function patchDates(doc,data){var r=doc.getElementById('date-range');if(r)r.textContent='7 Nov – 9 Dic';var status=doc.getElementById('trip-status'),bar=doc.getElementById('progress-bar');if(!status||!bar)return;var today=new Date();today=new Date(today.getFullYear(),today.getMonth(),today.getDate());var first=new Date(2026,10,7),last=new Date(2026,11,9),end=new Date(2026,11,10);var old=bar.querySelector('.progress__marker');if(old)old.remove();if(today<first){var d=Math.ceil((first-today)/86400000);status.innerHTML='<strong>Faltan '+d+' día'+(d===1?'':'s')+'</strong> para el despegue';return;}if(today>=end){status.textContent='✈️ Viaje completado — esperamos que haya sido increíble';return;}var pct=Math.max(0,Math.min(100,((today-first)/(last-first))*100)),m=doc.createElement('div');m.className='progress__marker';m.style.left=pct+'%';bar.appendChild(m);var current=null;(data&&data.days||[]).some(function(day){var z=String(day.date||'').match(/(\d{1,2})\s+(Nov|Dic)/);if(!z)return false;var dt=new Date(2026,z[2]==='Nov'?10:11,+z[1]);if(dt.getTime()===today.getTime()){current=day;return true;}return false;});if(current)status.innerHTML='<strong>Día '+current.num+' de '+data.days.length+'</strong> · '+current.place;else if(today<new Date(2026,10,9))status.innerHTML='<strong>En viaje</strong> · rumbo a Japón';else status.innerHTML='<strong>Último tramo del viaje</strong> · regreso / conexiones';}
function patchMapsLang(doc){doc.querySelectorAll('a[href*="google.com/maps"]').forEach(function(a){try{var u=new URL(a.href);u.searchParams.set('hl','es');u.searchParams.set('gl','es');a.href=u.toString();}catch(e){}});}
function patch(){try{var doc=frame.contentDocument;if(!doc)return;var data=sanitizeTripData(doc);removeMoneyUi(doc);injectStyles(doc);patchPdfLinks(doc);groupReservations(doc);patchFlightCard(doc);patchPrepare(doc);patchDates(doc,data);patchMapsLang(doc);frame.classList.add('ready');if(boot)boot.remove();}catch(e){frame.classList.add('ready');if(boot)boot.textContent='No se pudo cargar la bitácora.';console.error(e);}}
frame.addEventListener('load',patch);
})();
</script>
