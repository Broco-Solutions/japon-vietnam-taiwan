<!doctype html>
<html lang="es-AR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#101820">
<title>Vietnam · Taiwán · Japón 2026 — Bitácora del viaje</title>
<style>html,body{margin:0;min-height:100%;background:#101820;color:#f7f2e7;font-family:system-ui,sans-serif}.boot{min-height:100vh;display:grid;place-items:center;padding:24px;text-align:center}.boot small{opacity:.65}</style>
</head>
<body>
<div class="boot"><div>Cargando bitácora…<br><small>Vietnam · Taiwán · Japón 2026</small></div></div>
<script>
(async function(){
  const PDFS = [
    ["Perth → Hanoi","https://drive.google.com/file/d/1NKUVLbh5ionuN_2KO-xt08KpgIQ22xRJ/view?usp=sharing"],
    ["Tokyo → Hanoi","https://drive.google.com/file/d/1epa4TfSMFw4SnvViT5SvbL_CLl4Vz0HR/view?usp=sharing"],
    ["Hanoi → Da Nang","https://drive.google.com/file/d/1VoaAjVU37ww15meZJN384EL8VbDfBGLw/view?usp=sharing"],
    ["Da Nang → Taipei → Osaka","https://drive.google.com/file/d/1kC8V2_taDyDbymZs7UgcHstWifJdIfkH/view?usp=sharing"],
    ["Narita → Christchurch","https://drive.google.com/file/d/114hX3KXnVZ3X6RVZ-6EtL1lZiOT0lHlh/view?usp=sharing"],
    ["Buenos Aires ⇄ Tokyo","https://drive.google.com/file/d/1BbgHUdNLmSKXliQeA-hntVsG0t8HS4lm/view?usp=sharing"],
    ["Tầm Vị","https://drive.google.com/file/d/16oDmT-qAbgConRoP885jK4hGsZ0VHr-R/view?usp=sharing"]
  ];
  const res = await fetch("site.html", {cache:"no-store"});
  if(!res.ok) throw new Error("No se pudo cargar la bitácora");
  let html = await res.text();
  const patch = `<script>(function(){const PDFS=${JSON.stringify(PDFS)};function patchPdfLinks(){document.querySelectorAll('a.pdf-chip').forEach(function(a){const label=(a.getAttribute('aria-label')||a.textContent||'');for(const item of PDFS){if(label.includes(item[0])){a.href=item[1];a.target='_blank';a.rel='noopener noreferrer';break;}}});}document.addEventListener('DOMContentLoaded',patchPdfLinks);new MutationObserver(patchPdfLinks).observe(document.documentElement,{childList:true,subtree:true});patchPdfLinks();})();<\/script>`;
  html = html.replace("</body>", patch + "</body>");
  document.open();
  document.write(html);
  document.close();
})().catch(function(err){document.body.innerHTML='<div class="boot"><div>No se pudo cargar el viaje.<br><small>'+String(err.message||err)+'</small></div></div>';});
</script>
</body>
</html>
